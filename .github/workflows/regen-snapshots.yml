name: Regen Snapshots

on:
  push:
    paths:
         - '.github/workflows/regen-snapshots.yml'
    branches:
         - codex/repository-simplification

permissions:
  contents: write

jobs:
  regen:
    name: Regenerate mobile backtest snapshots for Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
        - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
          with:
            ref: codex/repository-simplification
            fetch-depth: 0

        - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
          with:
            node-version-file: .nvmrc
            cache: npm
            cache-dependency-path: frontend/package-lock.json

        - run: npm --prefix frontend ci --ignore-scripts

        - run: frontend/node_modules/.bin/playwright install --with-deps chromium

        - run: npm --prefix frontend run build-only

        - run: |
            cd frontend && npx playwright test tests-e2e/backtest-mobile.spec.ts --project mobile-chromium --update-snapshots

        - run: |
            git config user.name "TBMoonwalker"
            git config user.email "tb@moonwalker.dev"
            git add frontend/tests-e2e/backtest-mobile.spec.ts-snapshots/
            git commit -m "fix: regenerate backtest mobile snapshots for Linux" || echo "no changes to commit"
            git push origin HEAD/codex/repository-simplification
