name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"
      - "codex/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, build, audit, and dry-run E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CI: "1"
      MOONWALKER_RUN_E2E: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies without lifecycle scripts
        run: npm --prefix frontend ci --ignore-scripts

      - name: Install the pinned Playwright Chromium runtime
        run: frontend/node_modules/.bin/playwright install --with-deps chromium

      - name: Run the mandatory Moonwalker CI suite
        run: cd scripts && ./ci.sh
