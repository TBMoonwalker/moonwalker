[tool.ruff]
target-version = "py311"
line-length = 88
indent-width = 4
preview = false

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false
docstring-code-format = false

[tool.isort]
profile = "black"
line_length = 88

[tool.coverage.run]
branch = true
source = ["backend"]
omit = ["backend/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
