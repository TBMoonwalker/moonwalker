[tool.ruff]
target-version = "py311"
line-length = 88
indent-width = 4
preview = false

[tool.ruff.lint]
# Keep the pre-0.16 rule set explicit across formatter/linter upgrades.
# Expanding the lint policy is a separate, reviewed cleanup.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false
docstring-code-format = false

[tool.isort]
profile = "black"
line_length = 88

[tool.vulture]
paths = ["backend", "scripts"]
min_confidence = 100
sort_by_size = true

[tool.coverage.run]
branch = true
source = ["backend"]
omit = ["backend/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
